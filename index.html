<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#17365d">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Relatório de Realização de Atividade</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.png">
<link rel="apple-touch-icon" href="./icons/icon.png">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6fa;
    color: #1f2937;
}

.container {
    max-width: 880px;
    margin: auto;
    padding: 15px;
}

/* ==============================
   CABEÇALHO
============================== */

.cabecalho {
    background: #17365d;
    color: white;
    padding: 20px;
    border-radius: 14px;
}

.cabecalho h1 {
    margin: 0 0 7px;
    font-size: 21px;
}

.cabecalho p {
    margin: 0 0 12px;
}

#status {
    background: white;
    color: #17365d;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
}

.versao {
    margin-top: 10px;
    font-size: 12px;
    opacity: .85;
}

/* ==============================
   CARDS
============================== */

.card {
    background: white;
    margin-top: 14px;
    padding: 17px;
    border-radius: 13px;
    border: 1px solid #d8e0ea;
}

.card h2 {
    margin-top: 0;
    color: #17365d;
    font-size: 17px;
}

/* ==============================
   CAMPOS
============================== */

.campo {
    display: block;
    margin: 14px 0 5px;
    font-weight: bold;
}

input[type="text"],
input[type="tel"],
textarea {

    width: 100%;

    padding: 12px;

    border: 1px solid #c7d0db;
    border-radius: 8px;

    font-size: 16px;
    font-family: Arial, Helvetica, sans-serif;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

/* ==============================
   FOTOS
============================== */

.acoes-fotos {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 10px;
}

.botao-camera,
.botao-galeria {

    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 48px;

    padding: 12px;

    border-radius: 8px;

    font-weight: bold;

    cursor: pointer;
}

.botao-camera {
    background: #17365d;
    color: white;
}

.botao-galeria {

    background: #e6eef8;

    color: #17365d;

    border: 1px solid #c5d5e8;
}

.botao-camera input,
.botao-galeria input {
    display: none;
}

/* ==============================
   GALERIA
============================== */

.galeria {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 10px;

    margin-top: 12px;
}

.foto {

    position: relative;

    background: white;

    border: 1px solid #d8e0ea;

    border-radius: 9px;

    overflow: hidden;

    padding-bottom: 8px;
}

.foto img {

    width: 100%;

    aspect-ratio: 1;

    object-fit: cover;
}

.legenda {

    width: calc(100% - 12px);

    margin: 7px 6px 0;

    padding: 8px;

    border: 1px solid #c7d0db;

    border-radius: 7px;
}

.remover {

    position: absolute;

    right: 5px;
    top: 5px;

    width: 34px;
    height: 34px;

    border: none;

    border-radius: 50%;

    background: #b42318;

    color: white;

    font-size: 20px;

    cursor: pointer;
}

.nota,
.contador {

    margin-top: 8px;

    color: #667085;

    font-size: 12px;
}

/* ==============================
   BOTÕES
============================== */

.acoes {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;
}

button {

    border: none;

    border-radius: 8px;

    padding: 12px 15px;

    font-weight: bold;

    cursor: pointer;
}

#salvar {
    background: #16794b;
    color: white;
}

#relatorios {
    background: #17365d;
    color: white;
}

#pdf {
    background: #5b3f8c;
    color: white;
}

#limpar {
    background: #fee4e2;
    color: #b42318;
}

/* ==============================
   RELATÓRIOS SALVOS
============================== */

#painelRelatorios {
    display: none;
}

.relatorio-item {

    border: 1px solid #d8e0ea;

    border-radius: 10px;

    padding: 12px;

    margin-top: 10px;
}

.relatorio-item strong {

    display: block;

    color: #17365d;

    font-size: 16px;
}

.relatorio-info {

    font-size: 13px;

    color: #667085;

    margin-top: 4px;
}

.relatorio-botoes {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 10px;
}

.btn-abrir {
    background: #17365d;
    color: white;
}

.btn-pdf {
    background: #5b3f8c;
    color: white;
}

.btn-excluir {
    background: #fee4e2;
    color: #b42318;
}

/* ==============================
   RODAPÉ
============================== */

.rodape {

    text-align: center;

    color: #667085;

    font-size: 12px;

    padding: 25px;
}

@media(min-width:650px) {

    .galeria {
        grid-template-columns:
            repeat(3,1fr);
    }

}

@media(max-width:400px) {

    .acoes-fotos {
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>

Relatório de Realização de Atividade

<script>

"use strict";


/* =========================================================
   SERVICE WORKER
========================================================= */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        async () => {

            try {

                const registro =
                    await navigator.serviceWorker.register(
                        "./service-worker.js",
                        {
                            updateViaCache:
                                "none"
                        }
                    );

                await registro.update();

            }
            catch(erro) {

                console.error(
                    "Erro Service Worker:",
                    erro
                );

            }

        }
    );

}


/* =========================================================
   BANCO INDEXEDDB
========================================================= */

const DB_NAME =
    "RelatoriosAtividadeDB";

const DB_VERSION =
    1;

const STORE_NAME =
    "relatorios";


function abrirBanco() {

    return new Promise(
        (resolve,reject) => {

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                event => {

                    const db =
                        event.target.result;


                    if (
                        !db.objectStoreNames.contains(
                            STORE_NAME
                        )
                    ) {

                        const store =
                            db.createObjectStore(
                                STORE_NAME,
                                {
                                    keyPath:"id"
                                }
                            );


                        store.createIndex(
                            "data",
                            "data",
                            {
                                unique:false
                            }
                        );

                    }

                };


            request.onsuccess =
                () =>
                    resolve(
                        request.result
                    );


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =========================================================
   VARIÁVEIS
========================================================= */

let fotosAntes = [];

let fotosDepois = [];

let relatorioAbertoId = null;


/* =========================================================
   ID
========================================================= */

function gerarId() {

    if (
        crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();

    }

    return (
        Date.now()
        +
        "-"
        +
        Math.random()
    );

}


/* =========================================================
   ADICIONAR FOTO
========================================================= */

function adicionarFotos(
    input,
    lista,
    galeria,
    contador
) {

    const arquivos =
        Array.from(
            input.files || []
        );


    arquivos.forEach(
        arquivo => {

            if (
                arquivo.type.startsWith(
                    "image/"
                )
            ) {

                lista.push({

                    id:
                        gerarId(),

                    blob:
                        arquivo,

                    legenda:
                        ""

                });

            }

        }
    );


    input.value = "";


    renderizarGaleria(
        lista,
        galeria,
        contador
    );

}


/* =========================================================
   GALERIA
========================================================= */

function renderizarGaleria(
    lista,
    galeriaId,
    contadorId
) {

    const galeria =
        document.getElementById(
            galeriaId
        );


    galeria.innerHTML = "";


    lista.forEach(
        (foto,index) => {

            const bloco =
                document.createElement(
                    "div"
                );


            bloco.className =
                "foto";


            const img =
                document.createElement(
                    "img"
                );


            const url =
                URL.createObjectURL(
                    foto.blob
                );


            img.src = url;


            img.onload =
                () =>
                    URL.revokeObjectURL(
                        url
                    );


            const legenda =
                document.createElement(
                    "input"
                );


            legenda.className =
                "legenda";


            legenda.placeholder =
                "Legenda opcional";


            legenda.value =
                foto.legenda || "";


            legenda.oninput =
                () => {

                    foto.legenda =
                        legenda.value;

                };


            const remover =
                document.createElement(
                    "button"
                );


            remover.type =
                "button";


            remover.className =
                "remover";


            remover.innerText =
                "×";


            remover.onclick =
                () => {

                    lista.splice(
                        index,
                        1
                    );


                    renderizarGaleria(
                        lista,
                        galeriaId,
                        contadorId
                    );

                };


            bloco.appendChild(
                img
            );


            bloco.appendChild(
                remover
            );


            bloco.appendChild(
                legenda
            );


            galeria.appendChild(
                bloco
            );

        }
    );


    document.getElementById(
        contadorId
    ).innerText =

        lista.length
        +
        (
            lista.length === 1
            ?
            " foto"
            :
            " fotos"
        );

}


/* =========================================================
   EVENTOS DAS FOTOS
========================================================= */

cameraAntes.onchange =
    function() {

        adicionarFotos(
            this,
            fotosAntes,
            "galeriaAntes",
            "contadorAntes"
        );

    };


galeriaAntesInput.onchange =
    function() {

        adicionarFotos(
            this,
            fotosAntes,
            "galeriaAntes",
            "contadorAntes"
        );

    };


cameraDepois.onchange =
    function() {

        adicionarFotos(
            this,
            fotosDepois,
            "galeriaDepois",
            "contadorDepois"
        );

    };


galeriaDepoisInput.onchange =
    function() {

        adicionarFotos(
            this,
            fotosDepois,
            "galeriaDepois",
            "contadorDepois"
        );

    };


/* =========================================================
   DADOS
========================================================= */

function obterDados() {

    return {

        nome:
            nome.value.trim(),

        area:
            area.value.trim(),

        atividade:
            atividade.value.trim(),

        contato:
            contato.value.trim(),

        empresa:
            empresa.value.trim(),

        descricao:
            descricao.value.trim()

    };

}


/* =========================================================
   SALVAR RELATÓRIO
========================================================= */

salvar.onclick =
async function() {

    if (
        !formulario.reportValidity()
    ) {

        return;

    }


    status.innerText =
        "Salvando relatório...";


    try {

        const db =
            await abrirBanco();


        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );


        const store =
            transaction.objectStore(
                STORE_NAME
            );


        const agora =
            new Date();


        const relatorio = {

            id:
                relatorioAbertoId
                ||
                gerarId(),

            data:
                agora.toISOString(),

            dados:
                obterDados(),

            fotosAntes:
                fotosAntes,

            fotosDepois:
                fotosDepois

        };


        store.put(
            relatorio
        );


        await new Promise(
            (resolve,reject) => {

                transaction.oncomplete =
                    resolve;

                transaction.onerror =
                    () =>
                        reject(
                            transaction.error
                        );

            }
        );


        relatorioAbertoId =
            relatorio.id;


        status.innerText =
            "Relatório salvo neste dispositivo.";


        await listarRelatorios();

    }
    catch(erro) {

        console.error(
            erro
        );


        status.innerText =
            "Erro ao salvar relatório.";


        alert(
            "Não foi possível salvar o relatório."
        );

    }

};


/* =========================================================
   LISTAR RELATÓRIOS
========================================================= */

async function listarRelatorios() {

    const db =
        await abrirBanco();


    const transaction =
        db.transaction(
            STORE_NAME,
            "readonly"
        );


    const store =
        transaction.objectStore(
            STORE_NAME
        );


    const request =
        store.getAll();


    request.onsuccess =
        () => {

            const registros =
                request.result
                .sort(
                    (a,b) =>
                        new Date(b.data)
                        -
                        new Date(a.data)
                );


            listaRelatorios.innerHTML =
                "";


            if (
                registros.length === 0
            ) {

                listaRelatorios.innerHTML =
                    "<p>Nenhum relatório salvo.</p>";

                return;

            }


            registros.forEach(
                relatorio => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "relatorio-item";


                    const titulo =
                        document.createElement(
                            "strong"
                        );


                    titulo.innerText =
                        relatorio.dados.atividade
                        ||
                        "Relatório";


                    const info =
                        document.createElement(
                            "div"
                        );


                    info.className =
                        "relatorio-info";


                    info.innerText =

                        new Date(
                            relatorio.data
                        )
                        .toLocaleString(
                            "pt-BR"
                        )

                        +

                        " • "

                        +

                        (
                            relatorio.dados.empresa
                            ||
                            ""
                        );


                    const botoes =
                        document.createElement(
                            "div"
                        );


                    botoes.className =
                        "relatorio-botoes";


                    /* ABRIR */

                    const abrir =
                        document.createElement(
                            "button"
                        );


                    abrir.innerText =
                        "✏️ Abrir";


                    abrir.className =
                        "btn-abrir";


                    abrir.onclick =
                        () =>
                            abrirRelatorio(
                                relatorio.id
                            );


                    /* PDF */

                    const pdfBtn =
                        document.createElement(
                            "button"
                        );


                    pdfBtn.innerText =
                        "📄 PDF";


                    pdfBtn.className =
                        "btn-pdf";


                    pdfBtn.onclick =
                        async () => {

                            await abrirRelatorio(
                                relatorio.id
                            );

                            await gerarPDF();

                        };


                    /* EXCLUIR */

                    const excluir =
                        document.createElement(
                            "button"
                        );


                    excluir.innerText =
                        "🗑️ Excluir";


                    excluir.className =
                        "btn-excluir";


                    excluir.onclick =
                        () =>
                            excluirRelatorio(
                                relatorio.id
                            );


                    botoes.append(
                        abrir,
                        pdfBtn,
                        excluir
                    );


                    item.append(
                        titulo,
                        info,
                        botoes
                    );


                    listaRelatorios.appendChild(
                        item
                    );

                }
            );

        };

}


/* =========================================================
   ABRIR RELATÓRIO
========================================================= */

async function abrirRelatorio(id) {

    const db =
        await abrirBanco();


    const transaction =
        db.transaction(
            STORE_NAME,
            "readonly"
        );


    const store =
        transaction.objectStore(
            STORE_NAME
        );


    const request =
        store.get(
            id
        );


    return new Promise(
        (resolve,reject) => {

            request.onsuccess =
                () => {

                    const relatorio =
                        request.result;


                    if (!relatorio) {

                        reject(
                            new Error(
                                "Relatório não encontrado."
                            )
                        );

                        return;

                    }


                    relatorioAbertoId =
                        relatorio.id;


                    nome.value =
                        relatorio.dados.nome || "";


                    area.value =
                        relatorio.dados.area || "";


                    atividade.value =
                        relatorio.dados.atividade || "";


                    contato.value =
                        relatorio.dados.contato || "";


                    empresa.value =
                        relatorio.dados.empresa || "";


                    descricao.value =
                        relatorio.dados.descricao || "";


                    fotosAntes =
                        relatorio.fotosAntes || [];


                    fotosDepois =
                        relatorio.fotosDepois || [];


                    renderizarGaleria(
                        fotosAntes,
                        "galeriaAntes",
                        "contadorAntes"
                    );


                    renderizarGaleria(
                        fotosDepois,
                        "galeriaDepois",
                        "contadorDepois"
                    );


                    status.innerText =
                        "Relatório carregado.";


                    window.scrollTo({
                        top:0,
                        behavior:"smooth"
                    });


                    resolve(
                        relatorio
                    );

                };


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =========================================================
   EXCLUIR
========================================================= */

async function excluirRelatorio(id) {

    if (
        !confirm(
            "Deseja excluir este relatório?"
        )
    ) {

        return;

    }


    const db =
        await abrirBanco();


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    transaction
        .objectStore(
            STORE_NAME
        )
        .delete(
            id
        );


    transaction.oncomplete =
        () => {

            if (
                relatorioAbertoId === id
            ) {

                relatorioAbertoId =
                    null;

            }


            listarRelatorios();

        };

}


/* =========================================================
   PAINEL RELATÓRIOS
========================================================= */

relatorios.onclick =
async function() {

    if (
        painelRelatorios.style.display
        ===
        "block"
    ) {

        painelRelatorios.style.display =
            "none";

        return;

    }


    painelRelatorios.style.display =
        "block";


    await listarRelatorios();


    painelRelatorios.scrollIntoView({
        behavior:"smooth"
    });

};


/* =========================================================
   BASE64
========================================================= */

function blobParaBase64(blob) {

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );


            reader.onerror =
                reject;


            reader.readAsDataURL(
                blob
            );

        }
    );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapar(texto) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto || "";


    return div.innerHTML;

}


/* =========================================================
   FOTOS RELATÓRIO
========================================================= */

async function montarFotos(
    lista,
    titulo
) {

    if (
        lista.length === 0
    ) {

        return `
            <h2>${titulo}</h2>
            <p>Nenhuma foto registrada.</p>
        `;

    }


    let html =
        `<h2>${titulo}</h2>
         <div class="photos">`;


    for (
        let i = 0;
        i < lista.length;
        i++
    ) {

        const foto =
            lista[i];


        const src =
            await blobParaBase64(
                foto.blob
            );


        html += `

        <figure>

        <img src="${src}">

        <figcaption>

        ${
            escapar(
                foto.legenda
                ||
                "Foto "
                +
                (i+1)
            )
        }

        </figcaption>

        </figure>

        `;

    }


    html +=
        "</div>";


    return html;

}
